name: CI

# The tests are offline by design — `_call_kimi` and the OpenAI client are the
# only network seams and every test injects them — so CI needs no API key and
# never spends anything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the README promises, through the newest released.
        # This matrix exists because two 3.10 incompatibilities reached main
        # while every check ran on a single 3.14 interpreter.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    name: tests · py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    name: ruff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # ruff.toml pins the rule set and `target-version`, so this catches syntax
      # a newer interpreter would happily accept.
      - run: ruff check .
